openapi: "3.1.0"
info:
  title: Doctor Antivejez API
  version: "2.0.0"
  description: |
    API de los servicios **Doctor Antivejez**, distribuidos a través del
    **Marketplace Vita App** de Disglobal.

    Plataforma tecnológica: **Vytalix**, motor de servicios API que soporta los
    productos digitales de Doctor Antivejez.

    Este contrato cubre **únicamente el alcance de la Fase 1**: cinco endpoints
    de integración. No describe el resto de la plataforma.

    **Endpoints de la Fase 1:**
    1. `POST /api/funnel/leads` — registro de interesado
    2. `POST /api/funnel/facial-analysis` — escáner facial
    3. `POST /api/funnel/vitality-assessment` — cuestionario preventivo
    4. `POST /api/funnel/booking` — solicitud de consulta
    5. `POST /api/v2/webhooks/payment` — confirmación de pago

    > **Aviso obligatorio:** la evaluación digital preventiva es una aproximación
    > basada en hábitos y mediciones declaradas. **No constituye un diagnóstico
    > médico y no sustituye la consulta médica presencial.**

    **Autenticación:**
    - Endpoints `/api/funnel/*`: sin autenticación en esta fase
    - `POST /api/v2/webhooks/payment`: firma HMAC-SHA256 en el campo `signature`
      del cuerpo de la petición (no es un header)

    **Escáner facial:** el proveedor activo por defecto es `mock`, que deriva el
    valor de la imagen recibida y no realiza análisis biométrico. Lea el campo
    `provider` de la respuesta antes de mostrar cualquier valor a un usuario final.
  contact:
    name: Integraciones — Doctor Antivejez
    email: integrations@vytalix.health

servers:
  - url: http://localhost:3001
    description: Entorno local. Único verificado en esta entrega.
  - url: https://sandbox.api.vytalix.health
    description: >-
      Sandbox. Confirme esta URL por escrito antes de usarla como base de la
      integración.

tags:
  - name: Health
    description: Platform health and observability
  - name: Funnel
    description: Captación de interesados y Cuestionario Preventivo Estructurado (sin autenticación)
  - name: Payments
    description: Payment lifecycle webhooks (Disglobal)

# ─── Security Schemes ────────────────────────────────────────────

components:

  # ─── Reusable Schemas ──────────────────────────────────────────

  schemas:

    ProblemDetail:
      type: object
      required: [type, title, status, detail, correlationId]
      properties:
        type:          { type: string, format: uri }
        title:         { type: string }
        status:        { type: integer }
        detail:        { type: string }
        correlationId: { type: string, format: uuid }

    FunnelMeta:
      type: object
      required: [correlationId, timestamp]
      properties:
        correlationId: { type: string, format: uuid }
        timestamp:     { type: string, format: date-time }

# ─── Paths ────────────────────────────────────────────────────────

paths:

  # ── Health ────────────────────────────────────────────────────────

  /health:
    get:
      tags: [Health]
      summary: Platform health check
      operationId: getHealth
      responses:
        "200":
          description: Platform is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:    { type: string, enum: [ok, degraded] }
                  version:   { type: string }
                  timestamp: { type: string, format: date-time }
                  checks:
                    type: object
                    properties:
                      database: { type: string }
                      redis:    { type: string }

  # ── Funnel (public, no auth) ───────────────────────────────────────

  /api/funnel/leads:
    post:
      tags: [Funnel]
      summary: "Paso 1: registro de interesado"
      operationId: createFunnelLead
      description: |
        Registra un interesado y devuelve un `id` para correlacionar el resto del
        recorrido. Si ya existe un registro con el mismo `email` en las últimas 24
        horas, responde `200` con el `id` existente en lugar de crear otro.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, interestType, source, consentMarketing, consentDataProcessing]
              properties:
                name:         { type: string, minLength: 2, maxLength: 200 }
                email:        { type: string, format: email }
                interestType:
                  type: string
                  enum: [DEMO_PLATAFORMA, INTEGRACION_EMR, PARTNERSHIP_CLINICO,
                         INFORMACION_GENERAL, LONGEVIDAD_CLINICA,
                         ODONTOLOGIA_LONGEVIDAD, TURISMO_SALUD]
                source:
                  type: string
                  enum: [CTA_FORM, VITALITY_TEST_RESULT, FACIAL_ANALYSIS_RESULT,
                         CONSULTA_EXPLORATORIA, HERO_CTA]
                consentMarketing:      { type: boolean }
                consentDataProcessing: { type: boolean, description: "Debe ser true para continuar" }
                organization: { type: string, maxLength: 255 }
                phone:        { type: string, maxLength: 50 }
                country:      { type: string, minLength: 2, maxLength: 2 }
                message:      { type: string, maxLength: 2000 }
                utmSource:    { type: string, maxLength: 100 }
                utmCampaign:  { type: string, maxLength: 100 }
                referralCode: { type: string, maxLength: 50 }
                vitalityAssessmentId: { type: string, format: uuid }
                facialAnalysisId:     { type: string, format: uuid }
            examples:
              minimo:
                value:
                  name: "Kevin Perdomo"
                  email: "kevin@disglobal.test"
                  interestType: "LONGEVIDAD_CLINICA"
                  source: "HERO_CTA"
                  consentMarketing: true
                  consentDataProcessing: true
      responses:
        "201":
          description: Interesado registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:                    { type: string, format: uuid }
                      status:                { type: string, enum: [NEW] }
                      confirmationEmailSent: { type: boolean }
                  meta: { $ref: '#/components/schemas/FunnelMeta' }
        "200":
          description: Ya existía un registro con ese email en las últimas 24 horas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:     { type: string, format: uuid }
                      status: { type: string, enum: [EXISTING] }
                  meta: { $ref: '#/components/schemas/FunnelMeta' }
        "422":
          description: Validación fallida, o consentDataProcessing en false
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/funnel/vitality-assessment:
    post:
      tags: [Funnel]
      summary: "Paso 2: cuestionario preventivo"
      operationId: funnelVitalityAssessment
      description: |
        Almacena un resultado de cuestionario **ya calculado por Disglobal**.
        Este endpoint no ejecuta ningún cálculo: persiste los valores recibidos y
        devuelve un identificador. `answersPayload` es un mapa libre de booleanos
        y admite 45 preguntas sin cambio de esquema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score, category, yearsBiological, chronologicalAgeGroup,
                         dimensions, answersPayload, completedAt]
              properties:
                score:           { type: integer, minimum: 0, maximum: 100 }
                category:        { type: string, enum: [EXCELENTE, BUENO, REGULAR, CRITICO] }
                yearsBiological: { type: integer, minimum: 18, maximum: 120 }
                chronologicalAgeGroup:
                  type: string
                  enum: ["45", "59", "69", "78"]
                  description: "Tramo de edad, no un número de años"
                dimensions:
                  type: object
                  required: [energiaEstadoMental, suenoCognicion, composicionCorporal,
                             signosEnvejecimiento, rangoEdad]
                  properties:
                    energiaEstadoMental:  { type: integer, minimum: 0, maximum: 100 }
                    suenoCognicion:       { type: integer, minimum: 0, maximum: 100 }
                    composicionCorporal:  { type: integer, minimum: 0, maximum: 100 }
                    signosEnvejecimiento: { type: integer, minimum: 0, maximum: 100 }
                    rangoEdad:            { type: integer, minimum: 0, maximum: 100 }
                answersPayload:
                  type: object
                  additionalProperties: { type: boolean }
                completedAt:     { type: string, format: date-time }
                durationSeconds: { type: integer, minimum: 1 }
                deviceType:      { type: string, enum: [mobile, desktop, tablet] }
                sessionId:       { type: string, maxLength: 100 }
                leadId:          { type: string, format: uuid }
            examples:
              completo:
                value:
                  score: 72
                  category: "BUENO"
                  yearsBiological: 47
                  chronologicalAgeGroup: "45"
                  dimensions:
                    energiaEstadoMental: 70
                    suenoCognicion: 65
                    composicionCorporal: 80
                    signosEnvejecimiento: 75
                    rangoEdad: 70
                  answersPayload: { q1: true, q2: false, q3: true }
                  completedAt: "2026-08-07T10:00:00.000Z"
                  durationSeconds: 480
                  deviceType: "mobile"
      responses:
        "201":
          description: Resultado almacenado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                  meta: { $ref: '#/components/schemas/FunnelMeta' }
        "422":
          description: Validación fallida. `detail` contiene solo el primer fallo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/funnel/facial-analysis:
    post:
      tags: [Funnel]
      summary: "Paso 3: escáner facial"
      operationId: funnelFacialAnalysis
      description: |
        Recibe una imagen en base64 y devuelve un resultado estructurado.
        La imagen **no se almacena**: solo se guarda su hash SHA-256 para auditoría.

        El proveedor activo por defecto es `mock`, que deriva los valores de los
        bytes de la imagen y no realiza análisis facial. Lea el campo `provider`
        antes de mostrar cualquier valor a un usuario final.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageBase64]
              properties:
                imageBase64:
                  type: string
                  minLength: 100
                  maxLength: 3100000
                  description: "JPEG en base64. Máximo ~2 MB codificados"
                sessionId: { type: string, maxLength: 100 }
                leadId:    { type: string, format: uuid }
      responses:
        "200":
          description: Análisis completado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:             { type: string, format: uuid }
                      estimatedAge:   { type: integer }
                      confidence:     { type: number }
                      analysisPoints: { type: integer }
                      status:         { type: string, enum: [COMPLETED] }
                      provider:       { type: string, example: "mock" }
                      analyzedAt:     { type: string, format: date-time }
                  meta: { $ref: '#/components/schemas/FunnelMeta' }
              example:
                data:
                  id: "04a66eb7-8318-4611-b66d-e4dbbf7dd007"
                  estimatedAge: 51
                  confidence: 0.88
                  analysisPoints: 24
                  status: "COMPLETED"
                  provider: "mock"
                  analyzedAt: "2026-08-07T13:57:33.703Z"
                meta:
                  correlationId: "ea3497cf-8f2b-4a1e-9c33-71d0e5b2a9f4"
                  timestamp: "2026-08-07T13:57:33.703Z"
        "422":
          description: Imagen fuera de rango, o ningún rostro detectado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        "501":
          description: Proveedor de visión no soportado o no disponible
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        "502":
          description: El proveedor de visión no respondió correctamente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        "504":
          description: El proveedor de visión superó el tiempo de espera
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/funnel/booking:
    post:
      tags: [Funnel]
      summary: "Paso 4: solicitud de consulta"
      operationId: createFunnelBooking
      description: |
        Registra una solicitud de consulta y devuelve un código de confirmación con
        un enlace de WhatsApp. **No reserva cupo ni consulta disponibilidad.**

        Ningún campo distingue hoy consulta online de presencial: `consultationType`
        selecciona la materia de la consulta, no el canal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, consultationType]
              properties:
                name:  { type: string, minLength: 2, maxLength: 200 }
                email: { type: string, format: email }
                consultationType:
                  type: string
                  enum: [EXPLORATORIA_LONGEVIDAD, EXPLORATORIA_DENTAL,
                         EXPLORATORIA_PREVENTIVA, SEGUNDA_OPINION]
                phone: { type: string, maxLength: 50 }
                specialistPreference:
                  type: string
                  enum: [longevity, dental, preventive, any]
                preferredDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
                preferredTime: { type: string, enum: [morning, afternoon, evening] }
                timezone:      { type: string, maxLength: 50, default: "America/Caracas" }
                vitalityScore: { type: integer, minimum: 0, maximum: 100 }
                vitalityCategory: { type: string, enum: [EXCELENTE, BUENO, REGULAR, CRITICO] }
                chiefConcern:  { type: string, maxLength: 500 }
                leadId:        { type: string, format: uuid }
                sessionId:     { type: string, maxLength: 100 }
            examples:
              minimo:
                value:
                  name: "Kevin Perdomo"
                  email: "kevin@disglobal.test"
                  consultationType: "EXPLORATORIA_LONGEVIDAD"
      responses:
        "201":
          description: Solicitud registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: >-
                          Identificador de respuesta. No es la clave del registro
                          almacenado; para correlacionar use confirmationCode.
                      status:              { type: string, enum: [WHATSAPP_ONLY] }
                      confirmationCode:    { type: string }
                      confirmationChannel: { type: string, enum: [WHATSAPP] }
                      whatsappFallbackUrl: { type: string, format: uri }
                      nextSteps:           { type: array, items: { type: string } }
                  meta: { $ref: '#/components/schemas/FunnelMeta' }
        "422":
          description: Validación fallida. `detail` contiene solo el primer fallo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v2/webhooks/payment:
    post:
      tags: [Payments]
      summary: Disglobal payment confirmation webhook
      operationId: receivePaymentWebhook
      # Not protected by an API key or JWT: authentication is the HMAC-SHA256
      # `signature` field carried in the body (see description).
      security: []
      description: |
        Receives payment lifecycle notifications from Disglobal.

        **Authentication — HMAC-SHA256.** The request is not authenticated with an
        API key. Instead, `signature` must be the hex-encoded HMAC-SHA256 of the
        *canonical* JSON body, computed with the shared secret
        (`DISGLOBAL_WEBHOOK_SECRET`). The canonical body is a JSON object built with
        exactly these keys, in this order, excluding `signature`:

        `event, intentId, amount, currency, timestamp, subjectRef, metadata`

        Any deviation in key order or content produces a different digest and the
        request is rejected with `401`. Comparison is timing-safe.

        **Transactional guarantee.** The payment is persisted inside a database
        transaction and `200` is returned **only after the COMMIT succeeds**. If
        persistence fails the endpoint returns `500` and publishes no event, so the
        caller must retry.

        **Idempotency.** Deduplication is database-authoritative on `intentId`.
        Replaying a webhook returns `200` with `replayed: true` and never
        re-activates the service or re-notifies the patient. Retrying after a `500`
        or a timeout is therefore always safe.

        Only `payment.confirmed` performs work; `payment.failed` and
        `payment.refunded` are acknowledged without side effects.

        Ejemplo de firma ejecutable en `examples/` (curl y Node.js).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, intentId, amount, currency, timestamp, subjectRef, signature]
              properties:
                event:
                  type: string
                  enum: [payment.confirmed, payment.failed, payment.refunded]
                intentId:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Disglobal payment intent id — the idempotency key.
                amount:
                  type: integer
                  minimum: 1
                  description: Amount in minor units (cents).
                currency:
                  type: string
                  minLength: 3
                  maxLength: 3
                  description: ISO 4217 code, e.g. "USD".
                timestamp:
                  type: string
                  format: date-time
                subjectRef:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Pseudonymised buyer reference.
                metadata:
                  type: object
                  additionalProperties: { type: string }
                  default: {}
                  description: String map. `product` selects the purchased service.
                signature:
                  type: string
                  description: Hex-encoded HMAC-SHA256 of the canonical body.
            examples:
              paymentConfirmed:
                summary: Confirmed payment for a facial scan
                value:
                  event: payment.confirmed
                  intentId: intent-9f2c41
                  amount: 4900
                  currency: USD
                  timestamp: "2026-07-27T14:05:00.000Z"
                  subjectRef: DISG-8c1e5a
                  metadata: { product: FACIAL_SCAN }
                  signature: 3f1b9c0d5e...  # HMAC-SHA256 hex digest
      responses:
        "200":
          description: |
            Payment recorded (COMMIT succeeded) or already known. Safe to stop retrying.
          content:
            application/json:
              schema:
                type: object
                required: [received, replayed]
                properties:
                  received: { type: boolean, const: true }
                  replayed:
                    type: boolean
                    description: true when this intentId was already recorded.
              examples:
                firstDelivery:
                  value: { received: true, replayed: false }
                replay:
                  value: { received: true, replayed: true }
        "400":
          description: Payload failed schema validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "401":
          description: Invalid HMAC signature.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
              example:
                type: "https://api.vytalix.health/errors/401"
                title: Unauthorized
                status: 401
                detail: Invalid webhook signature
                correlationId: 7f3a1c92-0f4b-4e2a-9d61-2b8c5e0a1d34
        "500":
          description: |
            Payment could NOT be recorded — no event was published. Retry with the
            same `intentId`; deduplication makes the retry safe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
              example:
                type: "https://api.vytalix.health/errors/500"
                title: Error
                status: 500
                detail: Payment could not be recorded; please retry
                correlationId: 7f3a1c92-0f4b-4e2a-9d61-2b8c5e0a1d34
